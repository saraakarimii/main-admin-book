services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chromabook
      POSTGRES_USER: chromabook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chromabook -d chromabook"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chromabook:${POSTGRES_PASSWORD}@db:5432/chromabook
      CHROMABOOK_DATA_DIR: /data
      CHROMABOOK_ADMIN_TOKEN: ${CHROMABOOK_ADMIN_TOKEN:?Set CHROMABOOK_ADMIN_TOKEN in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - chromabook_data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chromabook:${POSTGRES_PASSWORD}@db:5432/chromabook
      CHROMABOOK_DATA_DIR: /data
      CHROMABOOK_ADMIN_TOKEN: ${CHROMABOOK_ADMIN_TOKEN:?Set CHROMABOOK_ADMIN_TOKEN in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      WORKER_POLL_SECONDS: 2
    volumes:
      - chromabook_data:/data
    networks: [internal]

volumes:
  postgres_data:
  chromabook_data:

networks:
  internal:
    driver: bridge
